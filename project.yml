name: Tune
options:
  bundleIdPrefix: com.chltmddn752
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
  developmentLanguage: ko

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.8.4"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: ""

schemes:
  TuneUITests:
    build:
      targets:
        Tune: all
        TuneUITests: [test]
    test:
      targets:
        - TuneUITests

targets:
  Tune:
    type: application
    platform: iOS
    sources:
      - path: Tune
      - path: Shared
    entitlements:
      path: Tune/Tune.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.chltmddn752.tune
    info:
      path: Tune/Info.plist
      properties:
        CFBundleDisplayName: Tune
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        CADisableMinimumFrameDurationOnPhone: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.chltmddn752.tune
            CFBundleURLSchemes: [tune]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.mp3, public.mpeg-4-audio, org.xiph.flac, com.microsoft.waveform-audio, public.aiff-audio]
        NSPhotoLibraryUsageDescription: 플레이리스트 커버로 쓸 사진을 고를 때 사용합니다.
        ALTAppGroups:
          - group.com.chltmddn752.tune
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chltmddn752.tune
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconDark AppIconLight"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: TuneWidgets
    scheme: {}

  TuneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TuneUITests
    dependencies:
      - target: Tune
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chltmddn752.tune.uitests
        TEST_TARGET_NAME: Tune
        GENERATE_INFOPLIST_FILE: YES

  TuneWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TuneWidgets
      - path: Shared
    entitlements:
      path: TuneWidgets/TuneWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.chltmddn752.tune
    info:
      path: TuneWidgets/Info.plist
      properties:
        CFBundleDisplayName: Tune
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        ALTAppGroups:
          - group.com.chltmddn752.tune
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chltmddn752.tune.widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
