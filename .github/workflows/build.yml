name: Build RPG Keyboard IPA

on:
  push:
    branches: [rpg-keyboard]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rpgkeys-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project RPGKeys.xcodeproj \
            -scheme RPGKeys \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Show errors
        if: failure()
        run: grep -E "error:" xcodebuild.log | sort -u | head -200 || true

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/RPGKeys.app
          ls "$APP/PlugIns"
          ldid -S "$APP/PlugIns/RPGKeyboard.appex/RPGKeyboard"
          ldid -S "$APP/RPGKeys"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry RPGKeys.ipa Payload
          ls -lh RPGKeys.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: RPGKeys-ipa
          path: RPGKeys.ipa

      - name: Save build log summary to ci-logs-rpg branch
        if: always()
        run: |
          mkdir -p /tmp/logs
          { echo "run: ${{ github.run_number }} commit: ${{ github.sha }}"; grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" xcodebuild.log | sed -E 's#.*/(RPGKeys|Keyboard|Shared|App)/#\1/#' | sort -u | head -400; } > /tmp/logs/build-summary.txt || true
          cd /tmp/logs
          git init -q -b ci-logs-rpg
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add build-summary.txt
          git commit -qm "rpgkeys build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs-rpg

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rpgkeys-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: RPG 키보드 빌드 ${{ github.run_number }}
          body: "SideStore로 RPGKeys.ipa를 설치하세요. 커밋: ${{ github.sha }}"
          prerelease: true
          files: RPGKeys.ipa
