name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Tune.xcodeproj \
            -scheme Tune \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Show errors
        if: failure()
        run: grep -E "error:" xcodebuild.log | sort -u | head -200 || true

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Tune.app
          ldid -STuneWidgets/TuneWidgets.entitlements "$APP/PlugIns/TuneWidgets.appex/TuneWidgets"
          ldid -STune/Tune.entitlements "$APP/Tune"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Tune.ipa Payload
          ls -lh Tune.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Tune-ipa
          path: Tune.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: xcodebuild.log

      - name: Save build log summary to ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/logs
          { echo "run: ${{ github.run_number }} commit: ${{ github.sha }}"; grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" xcodebuild.log | sed -E 's#.*/tune-app/##' | sort -u | head -400; } > /tmp/logs/build-summary.txt || true
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add build-summary.txt
          git commit -qm "build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tune 빌드 ${{ github.run_number }}
          body: "SideStore로 Tune.ipa를 설치하세요. 커밋: ${{ github.sha }}"
          prerelease: true
          files: Tune.ipa
